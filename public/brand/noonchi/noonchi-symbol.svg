<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">noonchi symbol</title>
  <desc id="desc">A blue rounded slit containing two side-glancing eyes.</desc>
  <defs>
    <clipPath id="left-eye"><circle cx="32" cy="48" r="14"/></clipPath>
    <clipPath id="right-eye"><circle cx="64" cy="48" r="14"/></clipPath>
  </defs>
  <rect x="6" y="24" width="84" height="48" rx="24" fill="#2f6fd0"/>
  <circle cx="32" cy="48" r="14" fill="#ffffff"/>
  <circle cx="64" cy="48" r="14" fill="#ffffff"/>
  <circle cx="40.5" cy="48" r="8" fill="#16202e" clip-path="url(#left-eye)"/>
  <circle cx="72.5" cy="48" r="8" fill="#16202e" clip-path="url(#right-eye)"/>
</svg>
